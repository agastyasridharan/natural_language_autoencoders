      hook rather than the supplied actors' scaled marker-embedding replacement.
    resolved_at: 2026-09-10T16:59:00-04:00
    resolution: >-
      Replaced the generation and FVE paths with native marker-embedding
      replacement after sidecar-controlled L2 scaling to 150. The old outputs
      were preserved under invalid_wrong_injection_20260910 directories. A
      two-condition, ten-activation, two-sample GPU smoke test passed 40/40
      generations with exact marker-row equality, observed norms from
      150.000046 to 150.000092, no marker leaks, and no CJK alerts.
  - detected_at: 2026-09-10T16:23:00-04:00
