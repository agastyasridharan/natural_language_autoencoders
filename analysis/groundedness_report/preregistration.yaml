    analysis_weight: inverse_inclusion_probability
    ownership_competitors: all_other_real_claims_in_the_explanation

decoys:
  k: 20
  candidates_generated_per_scored_claim: 64
  accepted_candidate_pool_per_scored_claim: 64
  candidate_pool_validation: all_nonempty_and_pairwise_unique_after_strip_and_casefold
  invalid_pool_regeneration:
    trigger: primary_pool_fails_candidate_pool_validation
    maximum_calls: 1
    output: complete_replacement_pool_of_64
    invalid_proposal_is_part_of_final_pool: false
    cache_and_audit_both_responses: true
  candidate_order_frozen_before_numerical_measurement: true
  selected_by: first_generation_indices_passing_all_filters_at_first_successful_overlap_rung
  quantile:
    probability: 0.95
    convention: Hyndman_Fan_type_7_linear
    numpy_equivalent: numpy.quantile_values_0.95_method_linear
  relative_overlap_ladder: [0.10, 0.20, 0.35, 0.50, 0.75, 1.00]
  if_fewer_than_k_at_final_rung: unresolved
  source_absence_scope:
    fineweb: exact_causal_document_prefix_through_the_activation_token
    ood: exact_serialized_target_model_context_through_the_activation_token
    excludes: text_or_tool_results_after_the_activation_position

calibration:
  permitted_data:
    - fineweb_calibration_documents_only
    - deranged_activation_negative_controls_within_fineweb_calibration_only
  forbidden_data:
    - fineweb_evaluation_documents
    - any_ood_evaluation
    - any_ood_outcome
  shuffled_activation_derangement:
    method: one_seeded_cyclic_derangement_after_sha256_rank
    same_claim_text_and_directions: true
    no_activation_fixed_points: true
  threshold_quantile:
    probability: 0.95
    convention: Hyndman_Fan_type_7_linear
  nuisance_match_selection:
    target_calibration_claim_resolvability: 0.90
    eps_base_grid: [0.25, 0.50, 0.75, 1.00, 1.50, 2.00]
    eps_reconstruction_grid: [0.10, 0.20, 0.35, 0.50, 0.75, 1.00]
    selection_rule: >-
      Select the feasible pair with the smallest sum of grid ranks for which at
      least 90 percent of calibration claims retain k controls at the final
      overlap rung; break ties by smaller eps_base, then smaller
      eps_reconstruction. If no pair is feasible, freeze the largest pair and
      report the achieved resolvability without expanding either grid.
  tau_decoy_support: q95_of_decoy_activation_support_under_deranged_activation
  kappa_spec: q95_of_R_minus_Q95_D_under_deranged_activation
  kappa_theme: q95_of_median_X_under_deranged_activation
  kappa_support: q95_of_real_claim_activation_support_under_deranged_activation
  rho_own: 1.5
  freeze_artifact_before_evaluation: true

manual_audit:
  blinded_before_numerical_outcomes: true
  segmentation_items: 200
  decoy_items: 400
  sampling: equal_fineweb_and_ood_with_ood_equal_family_allocation
  segmentation_acceptance:
    exact_tiling_failures_allowed: 0
    atomic_claim_acceptability_minimum: 0.90
    claim_inventory_completeness_minimum: 0.90
  decoy_acceptance:
    source_absence_agreement_minimum: 0.90
    splice_naturalness_agreement_minimum: 0.90
  action_if_gate_fails: >-
    Stop expansion, revise prompts using audit items only, increment the
    protocol version, discard all affected automated labels, and rerun the
    blinded audit. Do not switch models based on groundedness outcomes.

inference:
