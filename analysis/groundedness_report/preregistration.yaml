    The verbalizer sampling temperature reproduces the published NLA method,
    and the 500-token budget matches its stated approximate inference length;
    a keyed draw makes each activation reproducible without changing that
    sampling distribution.

openai_text_pipeline:
  model: gpt-5.6-luna
  reasoning_effort: low
  api: responses
  api_key_environment_variable: OPENAI_API_KEY_2
  allow_fallback_key: false
  allow_fallback_model: false
  store: false
  structured_outputs_strict: true
  request_and_response_sha256_recorded: true
  resolved_model_and_system_fingerprint_recorded: true
  uses:
    - exact_claim_substring_identification_with_deterministic_connective_gaps
    - claim_class_and_subtype
    - candidate_decoy_generation
    - source_absence_judgment
    - splice_naturalness_judgment
  justification: >-
    Luna is the cost-sensitive high-volume GPT-5.6 tier and supports strict
    structured outputs. It is frozen before outcomes and is approximately one
    tenth of Terra's token price. No model substitution is permitted after an
    outcome is inspected.
  segmentation:
    representation: ordered_nonoverlapping_inclusive_ranges_over_lossless_indexed_chunks
    chunk_regex: '\w+|[^\w\s]|\s+'
    chunk_invariant: concatenated_chunks_equal_explanation_byte_for_byte
    boundary_rule: first_and_last_chunks_must_be_non_whitespace
    range_rule: ranges_are_in_source_order_and_may_not_overlap_or_nest
    extraction_rule: slice_original_explanation_at_the_returned_chunk_boundaries
    connective_rule: every_maximal_gap_before_between_or_after_claims
    conditional_adjudication:
      trigger: primary_response_fails_structural_validation
      maximum_calls: 1
      input: [indexed_source_chunks, invalid_primary_inventory, exact_validation_error]
      output: complete_replacement_inventory
      cache_and_audit_both_responses: true
    prohibited_code_repairs: [range_sorting, range_clipping, overlap_resolution, fuzzy_matching, whitespace_normalization]
    failure_rule: reject_if_the_primary_or_when_used_adjudicated_final_inventory_is_invalid
  candidate_judgments:
    response_rows: 64
    row_order: exact_candidate_input_order
    model_generated_candidate_index: false
    assigned_index: zero_based_array_position

