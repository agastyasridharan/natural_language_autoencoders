revision_reason: >-
  The V6 decoy audit was stopped after 12 completed claims and one failure,
  before any numerical outcome generation. The failed 64-candidate pool repeated
  one sentence with only trailing whitespace changed. The immutable V6 selection
  and failing generation-response SHA-256 values are
  f5e26640655848ce44cab381f589f1209b168a61decbbecd715f8de6f7fccd62 and
  bb7cfbb0fa520900629ad280f79880574f429ac57a485e0fd44197dfbaf1db47.
  A conditional full-pool regeneration prompt was developed only on that exposed
  failure and returned 64 strip-and-casefold-unique candidates; its cache SHA-256
  is 847cf3655f0944e326ff567535ff40beb671bead9c63c93e7568a715a7c800f6.
  V7 permits exactly one fixed complete replacement call when the primary pool
  is empty or duplicated after strip and casefold. The invalid proposal is never
  part of the candidate pool. All partial V6 decoy artifacts are excluded and
  all 25 FineWeb decoy-audit claims are rerun from fresh caches.

