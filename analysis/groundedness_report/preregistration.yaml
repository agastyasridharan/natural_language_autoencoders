    resampling_unit_ood: transcript
    method: percentile_cluster_bootstrap
    preserve_inverse_probability_claim_weights: true
  ood_aggregate: equal_weight_macro_average_over_16_families
  forbidden_interval: claim_iid_interval

quality_and_exclusions:
  retain_failed_benchmark_trajectories: true
  exclude_only:
