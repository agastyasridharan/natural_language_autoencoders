    eligible_tokens: assistant_natural_language_response_tokens_excluding_tool_calls_and_special_tokens
    minimum_left_context_tokens: 50
    short_trajectory_rule: use_all_eligible_positions_if_fewer_than_four
    generation:
      target_model: Qwen/Qwen2.5-7B-Instruct
      do_sample: false
