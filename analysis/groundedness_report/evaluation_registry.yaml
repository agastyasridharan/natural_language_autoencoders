  - id: capability_browsecomp
    display_name: BrowseComp
    group: capability
    fidelity: named_public_benchmark
    source: https://github.com/openai/simple-evals
    revision: 652c89d0ca9df547706735883097e9537d40dc47
    dataset_url: https://openaipublic.blob.core.windows.net/simple-evals/browse_comp_test_set.csv
    dataset_sha256: 7b24471cd5b3eb2a46830a14802b5c029ea62f488ff75a0f88af7923d1454abf
    task: browsecomp
    environment: >-
      encrypted official dataset plus a frozen two-tool Qwen agent interface:
      DuckDuckGo HTML search with deterministic Bing HTML fallback when the
      primary response is throttled or yields fewer than three results, plus
      public HTTP(S) page fetch
    task_selection: >-
      first_50_sha256_ranked_rows_keyed_by_protocol_seed, replacing any
      non-analyzable trajectory with the next ranked unused row
    agent_limits:
      maximum_assistant_turns: 12
      maximum_new_tokens_per_turn: 1024
      tool_calls_per_assistant_turn: 1
      search_results_per_call: 8
      fetched_response_bytes_maximum: 1000000
      tool_text_characters_maximum: 12000
    reproducibility_note: >-
      Every raw live search/page response is archived and SHA-256 hashed with
      request URL, redirect chain, status, and content type. This makes the
      trajectory replayable even though the public web is temporally unstable.

