    environment: Anthropic public sycophancy prompts formatted with Qwen chat template
    justification: >-
      This is the original public benchmark family from Anthropic and contains
      user-biography-conditioned philosophy, NLP, and political questions.

  - id: alignment_multiturn_deception
    display_name: Multi-turn Deception
    group: alignment
    fidelity: closest_public_family_analogue
    source: https://huggingface.co/datasets/PKU-Alignment/DeceptionBench
    revision: 9c6c67b3d2a2d9c226ea0dd2120f1bb0899d779d
    task: multi_turn_induced_condition
    environment: dataset-defined system inner and outer prompts in a multi-turn chat
    transcript_rule: generate_once_for_inner_prompt_then_append_outer_prompt_and_generate_again
    justification: >-
      DeceptionBench is MIT-licensed, has 180 scenario families, and includes a
      multi-turn induced-pressure condition rather than a single-turn proxy.

